    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111827;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 460px;

      background: #fff;
      border: 1px solid #edf0f4;
      border-radius: 28px;

      padding: 28px 18px 24px;

      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.07);
    }

    /* =========================
       PLAY BUTTON
    ========================= */

    .play-button {
      width: 66px;
      height: 66px;

      margin: 0 auto 14px;

      border-radius: 50%;
      background: #344054;

      display: flex;
      align-items: center;
      justify-content: center;

      text-decoration: none;

      transition: 0.2s ease;
    }

    .play-button:hover {
      background: #1f2937;
      transform: scale(1.05);
    }

    .play-icon {
      width: 0;
      height: 0;

      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
      border-left: 17px solid #fff;

      margin-left: 4px;
    }

    /* =========================
       TITLE
    ========================= */

    .title {
      text-align: center;

      font-size: 29px;
      font-weight: 800;
      letter-spacing: -0.8px;

      margin-bottom: 26px;
    }

    /* =========================
       QUALITY BOX
    ========================= */

    .quality-box {
      min-height: 76px;

      border-radius: 40px;
      border: 1px solid #e5e7eb;

      background: #f8f9fc;

      padding: 14px 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      color: #374151;
      font-size: 15px;
    }

    .server-icon {
      width: 20px;
      height: 17px;

      background: #2563eb;
      border-radius: 3px;

      position: relative;
      flex-shrink: 0;
    }

    .server-icon::before {
      content: "";

      position: absolute;

      width: 4px;
      height: 4px;

      border-radius: 50%;
      background: #fff;

      left: 4px;
      top: 4px;
    }

    .server-icon::after {
      content: "";

      position: absolute;

      width: 12px;
      height: 2px;

      background: #fff;

      left: 4px;
      bottom: 3px;
    }

    .quality {
      font-weight: 500;
      white-space: nowrap;
    }

    .resolution {
      font-weight: 800;

      background: #e9edf3;

      border-radius: 8px;

      padding: 4px 7px;

      white-space: nowrap;
    }

    .detected {
      font-weight: 600;
      white-space: nowrap;
    }

    .check {
      width: 19px;
      height: 19px;

      border-radius: 50%;
      background: #20a55a;

      color: #fff;

      font-size: 12px;
      font-weight: bold;

      display: flex;
      align-items: center;
      justify-content: center;

      position: absolute;

      transform: translateY(39px);
    }

    /* =========================
       INSTRUCTION
    ========================= */

    .instruction {
      display: flex;
      align-items: center;

      gap: 12px;

      margin: 24px 0 35px;

      padding-left: 30px;

      color: #596273;

      font-size: 16px;
    }

    .dot {
      width: 7px;
      height: 7px;

      flex-shrink: 0;

      background: #2563eb;
      border-radius: 50%;
    }

    /* =========================
       CONTINUE BUTTON
    ========================= */

    .continue-button {
      width: 100%;
      height: 57px;

      border-radius: 30px;

      background: #1e293b;
      color: #fff;

      font-size: 18px;
      font-weight: 700;

      text-decoration: none;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 13px;

      box-shadow: 0 5px 12px rgba(15, 23, 42, 0.15);

      transition: 0.2s ease;
    }

    .continue-button:hover {
      background: #111827;
      transform: translateY(-1px);
    }

    .arrow {
      font-size: 28px;
      line-height: 0;
      font-weight: 400;
    }

    /* =========================
       SEPARATOR
    ========================= */

    .separator {
      height: 1px;

      background: #e5e7eb;

      margin: 32px 0 18px;
    }

    /* =========================
       FEATURES
    ========================= */

    .features {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 28px;

      color: #4b5563;

      font-size: 14px;
      font-weight: 600;
    }

    .feature {
      display: flex;
      align-items: center;

      gap: 7px;

      white-space: nowrap;
    }

    .shield {
      color: #2563eb;
      font-size: 19px;
    }

    .lightning {
      color: #f59e0b;
      font-size: 19px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      body {
        padding: 10px;
      }

      .card {
        border-radius: 26px;
        padding: 27px 18px 23px;
      }

      .title {
        font-size: 28px;
      }

      .quality-box {
        padding: 14px 15px;
        gap: 6px;
        font-size: 13px;
      }

      .instruction {
        font-size: 15px;
        padding-left: 28px;
      }

      .features {
        gap: 16px;
        font-size: 12px;
      }
    }

    @media (max-width: 370px) {

      .quality-box {
        font-size: 12px;
      }

      .server-icon {
        width: 18px;
      }

      .features {
        gap: 9px;
        font-size: 11px;
      }
    }
  </style>
</head>
